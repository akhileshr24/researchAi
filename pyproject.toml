
[project]
name = "research-assistant"
version = "0.1.0"
description = "AI-powered research assistant using LangChain and LangGraph"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.0",
    "langchain-core>=1.7.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.3",
    "langchain-google-genai>=4.4.2",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.19",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.15.0",
    "trafilatura>=2.3.0",
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.41.0",
    "streamlit>=1.66.0",
    "requests>=2.34.2",
    "slowapi>=0.1.10",
    "pypdf>=7.0.1",
    "python-multipart>=0.0.33",
    "langchain-text-splitters>=1.1.3",
    "chromadb>=1.5.9",
    "langchain-huggingface>=1.2.3",
    "sentence-transformers>=6.2.0",
    "rank-bm25>=0.2.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
